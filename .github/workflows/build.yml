name: unbound-dnstap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pkg:
    name: OPNsense 26.7 pkg (FreeBSD 15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build package in FreeBSD 15.1 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: x86_64
          usesh: true
          mem: "8192"
          copyback: true
          prepare: |
            pkg update -f
            pkg install -y ca_root_nss
          run: |
            sed -i '' -e 's/\r$//' scripts/build-opnsense-pkg.sh scripts/pack-pkg.py
            chmod +x scripts/build-opnsense-pkg.sh scripts/pack-pkg.py
            /bin/sh scripts/build-opnsense-pkg.sh

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: unbound-opnsense26.7-freebsd15-amd64
          path: dist/*.pkg
          if-no-files-found: error

      - name: Resolve package version
        id: ver
        run: |
          pkg=$(ls dist/unbound-*-opnsense*-freebsd15-amd64.pkg | head -n1)
          base=$(basename "$pkg")
          ver=${base#unbound-}
          ver=${ver%%-opnsense*}
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: unbound ${{ steps.ver.outputs.version }} (DNSTAP, OPNsense 26.7)
          body: |
            Drop-in replacement for OPNsense 26.7 `unbound` with **DNSTAP** enabled.

            Permanent links:
            - Release: https://github.com/ha-harbor-ws/os-unbound/releases/latest
            - Package: https://github.com/ha-harbor-ws/os-unbound/releases/latest/download/unbound-latest.pkg
          files: |
            dist/*.pkg
          make_latest: true
          fail_on_unmatched_files: true
